[project]
name = "uk-radio-mcp"
version = "0.1.0"
description = "MCP server for UK radio frequency data: Ofcom WTR, RadioID, plus optional paid sources (RadioReference, RepeaterBook)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.2.0,<2",
  "httpx>=0.27",
]

[project.optional-dependencies]
radioreference = ["zeep>=4.2"]
dev = ["pytest>=8"]

[project.scripts]
uk-radio-mcp = "uk_radio_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_radio_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
